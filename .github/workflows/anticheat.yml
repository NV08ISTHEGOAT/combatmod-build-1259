name: Build CombatGuard anticheat
on:
  push:
    paths:
      - "anticheat/**"
      - ".github/workflows/anticheat.yml"
  pull_request:
    paths:
      - "anticheat/**"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anticheat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: combatguard-jar
          path: anticheat/build/libs/combatguard-*.jar
          if-no-files-found: error
