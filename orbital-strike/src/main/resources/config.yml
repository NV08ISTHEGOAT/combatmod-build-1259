# Orbital Strike Cannon
# Text uses MiniMessage formatting: https://docs.advntr.dev/minimessage/format.html
# Apply changes with /osc reload

# Don't change this. When the plugin updates the format, it replaces an older
# config.yml and keeps yours as config-old.yml.
config-version: 3

# How far away (in blocks) you can aim the rod.
max-range: 300
# Time between the cast and the TNT appearing. 10 ticks = 0.5 s, like the Unstable SMP.
strike-delay-ticks: 10
# One tap: the rod breaks as soon as it fires.
consume-rod: true
# Seconds a player has to wait between strikes. 0 = no cooldown.
cooldown-seconds: 0
# Announce every strike in chat.
broadcast: false

# Nuke: a compressed TNT shoots down and lands on the target, lit rings of TNT
# appear in the sky, fall straight down, and everything explodes on the ground.
# (20 ticks = 1 second)
nuke:
  # The compressed TNT starts this many blocks above the target...
  shoot-height: 80
  # ...and flies down at this many blocks per tick (max 3.9).
  shoot-speed: 3.0
  # The lit rings appear this many blocks above the target...
  sky-height: 60
  # ...this many ticks after the compressed TNT lands...
  ring-delay-ticks: 10
  # ...one ring every this many ticks, inside ring first.
  ring-interval-ticks: 2
  # Rings around the target: radius 6, 10, 14 ... 34 by default.
  rings: 8
  first-radius: 6
  radius-step: 4
  # Blocks between TNT on a ring. Smaller = tighter rings and more TNT.
  tnt-spacing: 1.5
  # Once all the TNT has landed, it explodes this many ticks later.
  explode-after-landing-ticks: 20
  # Explosion strength of each ring TNT (vanilla TNT = 4.0)...
  power: 4.0
  # ...and of the compressed TNT in the middle.
  core-power: 8.0

stab:
  # The column starts this many blocks above the target block...
  start-above: 5
  # ...with a layer of TNT every this many blocks going down...
  step: 4
  tnt-per-layer: 5
  # ...until it hits a block at least this blast resistant (obsidian = 1200,
  # bedrock and reinforced deepslate are higher) or the bottom of the world.
  stop-at-resistance: 1200
  # 1 tick = the whole column goes off at once.
  fuse-ticks: 1
  power: 4.0

items:
  nuke:
    name: "<gradient:#ff5f1f:#ffd000><bold>Orbital Strike Cannon</bold></gradient> <gray>(Nuke)"
    lore:
      - "<gray>One tap: drops <red>8 rings of TNT</red>"
      - "<gray>on the block you aim at."
  stab:
    name: "<gradient:#00c3ff:#a100ff><bold>Orbital Strike Cannon</bold></gradient> <gray>(Stab)"
    lore:
      - "<gray>One tap: drills a <aqua>TNT column</aqua>"
      - "<gray>straight down to bedrock."

messages:
  prefix: "<dark_gray>[<gold>Orbital</gold>]</dark_gray> "
  no-target: "<red>No block in range to aim at."
  cooldown: "<red>Cannon recharging: <white><seconds>s</white> left."
  no-permission: "<red>You don't have permission to do that."
  fired: "<yellow><type> strike inbound at <white><x> <y> <z></white>!"
  broadcast: "<gold><player></gold> <yellow>called in an orbital <type> strike!"
  given: "<green>Gave <white><amount>x</white> <type> cannon to <white><player></white>."
  reloaded: "<green>Config reloaded."
